name: release-tag

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]   # matches 0.0.3, 1.10.2, ...

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Resolve version from tag
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        run: helm registry login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}

      - name: Build chart dependencies      # resolves the file://../crd-chart subchart
        run: helm dependency build ./chart

      - name: Package chart
        run: |
          helm package ./chart \
            --version "$VERSION" --app-version "$VERSION" \
            --destination ./dist

      - name: Push to GHCR
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          helm push ./dist/authn-"$VERSION".tgz "oci://ghcr.io/$OWNER"
