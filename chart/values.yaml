# Default values for authn.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/krateoplatformops/authn
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  annotations: {}
  type: ClusterIP
  port: 8082

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
readinessProbe:
  httpGet:
    path: /health
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

env:
  AUTHN_DEBUG: "true"
  AUTHN_KUBECONFIG_CLUSTER_NAME: "krateo"
  AUTHN_KUBECONFIG_CRT_EXPIRES_IN: "24h"
  AUTHN_KUBECONFIG_SERVER_URL: "https://kube-apiserver:6443"
  AUTHN_CORS: "true"
  AUTHN_DUMP_ENV: "true"

  # --- authn's own service certificate ---
  # These govern the `authn-clientconfig` Secret only, the identity snowplow
  # presents when it runs RESTActions on authn's behalf.
  # AUTHN_KUBECONFIG_CRT_EXPIRES_IN above still governs per-login user certs.
  #
  # A signer grants min(requested, --cluster-signing-duration, signer CA
  # remaining life), so the year requested here is not necessarily what you get:
  # OpenShift pins the signing duration to 720h and rotates its CSR signer CA
  # every 30 days. authn reads the granted expiry off the issued certificate and
  # records it on the Secret as `authn.krateo.io/certificate-not-after`.
  AUTHN_SERVICE_CRT_EXPIRES_IN: "8760h"
  # Re-issue once this fraction of the GRANTED lifetime has elapsed. Scaling
  # with what was granted rather than with what was asked lets one value serve
  # both a full year and a certificate a rotating signer CA cut to an hour.
  # Must be between 0 and 1 exclusive; out-of-range falls back to 0.66.
  AUTHN_CRT_RENEWAL_THRESHOLD: "0.66"
  # Off restores the pre-renewal behaviour: the certificate expires in place and
  # only a pod restart re-issues it.
  AUTHN_CRT_RENEWAL_ENABLED: "true"

jwtSignKeySecretName: jwt-sign-key